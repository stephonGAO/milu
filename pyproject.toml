[project]
name = "milu"
version = "0.1.0"
description = "统一AI模型抽象层，兼容多家厂商API"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.66.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "jsonschema>=4.20.0",
    "ddgs>=8.0.0",
    "pyyaml>=6.0",
    "markdownify>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
mcp = [
    "mcp>=1.0.0",
]

[project.scripts]
# 入口点（pip install 后可直接在终端调用）
milu = "milu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
