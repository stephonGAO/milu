[project]
name = "milu"
version = "0.1.0"
description = "Unified AI agent framework: one interface for 9 LLM providers (Qwen, Kimi, GLM, DeepSeek, MiniMax, Doubao, ChatGPT, Gemini, Claude) with tools, MCP, sub-agents, skills, RAG knowledge base, scheduler and multi-user serving"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "stephon" }]
keywords = [
    "ai", "agent", "llm", "agent-framework", "openai", "mcp", "rag",
    "multi-provider", "qwen", "deepseek", "kimi", "glm", "claude", "gemini",
    "multi-user", "multi-tenant", "concurrency", "agent-serving",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: AsyncIO",
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.66.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "jsonschema>=4.20.0",
    "ddgs>=8.0.0",
    "pyyaml>=6.0",
    "markdownify>=0.13.0",
    # doc_read 文档读取（docx/xlsx/xls/pdf/pptx）
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
    "python-pptx>=1.0.0",
    "xlrd>=2.0.0",
    # scheduler — 定时任务调度（cron 表达式解析）
    "croniter>=1.3.8",
    # 向量知识库（Agent(knowledge=...)）：numpy 暴力余弦检索（默认开启，故进核心）
    "numpy>=1.24",
    # 内置 Web 服务（milu serve）：FastAPI + uvicorn + SSE 流式
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "sse-starlette>=2.0.0",
    # MCP 协议（连接外部 MCP 服务器）：与 serve 依赖大量重叠，净增很小，故进核心
    "mcp>=1.0.0",
]

[project.optional-dependencies]
# 全功能已在核心：pip install milu 即得 CLI + Web 服务 + RAG + MCP。dev 仅测试用。
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

# ⚠️ GitHub 仓库建好后取消注释并替换 <USERNAME>，再发布 PyPI（页面左侧链接来自这里）
# [project.urls]
# Homepage = "https://github.com/<USERNAME>/milu"
# Repository = "https://github.com/<USERNAME>/milu"
# Issues = "https://github.com/<USERNAME>/milu/issues"
# Changelog = "https://github.com/<USERNAME>/milu/blob/main/CHANGELOG.md"

[project.scripts]
# 入口点（pip install 后可直接在终端调用）
milu = "milu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milu"]

# sdist 只打包构建/使用必需的文件——docs 内部报告、CLAUDE.md、config 本地配置不进发布包
[tool.hatch.build.targets.sdist]
include = [
    "src/milu",
    "tests",
    "examples",
    "README.md",
    "README.zh-CN.md",
    "CHANGELOG.md",
    "LICENSE",
    ".env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
