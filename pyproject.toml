[project]
name = "milu"
version = "0.5.1"
description = "Unified AI agent framework: one interface for 9 LLM providers (Qwen, Kimi, GLM, DeepSeek, MiniMax, Doubao, ChatGPT, Gemini, Claude) with tools, MCP, sub-agents, skills, RAG knowledge base, scheduler, multi-channel IM gateway (WeChat/Feishu/Telegram) and multi-user serving"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "stephon" }]
keywords = [
    "ai", "agent", "llm", "agent-framework", "openai", "mcp", "rag",
    "multi-provider", "qwen", "deepseek", "kimi", "glm", "claude", "gemini",
    "multi-user", "multi-tenant", "concurrency", "agent-serving",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: AsyncIO",
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.66.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "jsonschema>=4.20.0",
    "pyyaml>=6.0",
    "markdownify>=0.13.0",
    # doc_read 文档读取（docx/xlsx/xls/pdf/pptx）
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
    "python-pptx>=1.0.0",
    "xlrd>=2.0.0",
    # scheduler — 定时任务调度（cron 表达式解析）
    "croniter>=1.3.8",
    # 向量知识库（Agent(knowledge=...)）：numpy 暴力余弦检索（默认开启，故进核心）
    "numpy>=1.24",
    # 内置 Web 服务（milu serve）：FastAPI + uvicorn + SSE 流式
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "sse-starlette>=2.0.0",
    # MCP 协议（连接外部 MCP 服务器）：与 serve 依赖大量重叠，净增很小，故进核心
    "mcp>=1.0.0",
    # 多渠道网关 webhook 渠道（微信客服 / 飞书）回调消息 AES-256-CBC 加解密。
    # 体积小（约 12MB 含 cffi/pycparser）、各平台均有预编译 wheel，且撑起两个生产渠道，
    # 故进核心——webhook 渠道开箱即用（milu gateway 零额外安装）。
    "cryptography>=3.4",
    # asyncio.timeout() 的 Python 3.10 backport（3.11+ 用标准库，故仅 <3.11 安装）
    "async-timeout>=4.0; python_version < '3.11'",
]

[project.optional-dependencies]
# 全功能已在核心：pip install milu 即得 CLI + Web 服务 + RAG + MCP + 多渠道网关
# （微信客服 / 飞书 webhook / Telegram）。cryptography 已进核心依赖，webhook 渠道的
# 回调加解密开箱即用，无需 milu[wechat]/milu[feishu]/milu[gateway] 这类额外安装。
#
# 仅两个例外，因「装不上」或「太重」而保持可选：
# ① ddg：ddgs 的底层 primp 是 Rust 扩展，无预编译 wheel 的平台（Termux/Alpine 等）
#    会让安装卡死在源码编译，且 DDG 国内网络本就不可用，故降级为可选——需要
#    DuckDuckGo 免 Key 搜索时 pip install "milu[ddg]"。
ddg = [
    "ddgs>=8.0.0",
]
# ② 飞书长连接（websocket）模式：本地开发免隧道。走官方 lark-oapi SDK 的 ws 客户端
#    作传输（私有 protobuf 帧协议）。该 SDK 体积偏大（约 57MB，含 protobuf/pycryptodome/
#    websockets），且仅 FEISHU_MODE=ws 的本地开发才需要——飞书 webhook 生产模式零额外
#    依赖，故不进核心、保持可选：pip install "milu[feishu-ws]"。
feishu-ws = [
    "lark-oapi>=1.2",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.15",
]

[project.urls]
Homepage = "https://github.com/stephonGAO/milu"
Repository = "https://github.com/stephonGAO/milu"
Issues = "https://github.com/stephonGAO/milu/issues"
Changelog = "https://github.com/stephonGAO/milu/blob/main/CHANGELOG.md"

[project.scripts]
# 入口点（pip install 后可直接在终端调用）
milu = "milu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milu"]

# sdist 只打包构建/使用必需的文件——docs 内部报告、CLAUDE.md、config 本地配置不进发布包
[tool.hatch.build.targets.sdist]
include = [
    "src/milu",
    "tests",
    "examples",
    "README.md",
    "README.zh-CN.md",
    "CHANGELOG.md",
    "LICENSE",
    ".env.example",
]
# include 的 "tests"/"examples" 是 gitignore 式通配、会匹配任意层级目录；显式排除
# Agent 隔离 worktree 残留 milu.worktrees/，否则其内的 tests/examples/src 副本会被卷入 sdist
exclude = [
    "milu.worktrees",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100          # 仅 formatter 用；E501 未启用，不强制行宽（含大量中文长行）

[tool.ruff.lint]
# 首次接入聚焦「真实问题」：pyflakes(F) + 关键 pycodestyle(E4/E7/E9)——
# 未用导入/变量、未定义名、坏 f-string、语法/缩进类错误。暂不引入会大面积
# 改写的风格规则（行宽 E501、import 排序 I 等），降低噪声与历史污染。
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402",  # 模块级导入不在文件顶部——milu 大量「延迟/条件导入」（可选依赖守卫、
             # 规避循环导入、按需加载）属有意设计，不强制上移
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # 包导出（re-export）+ provider 经导入自注册的副作用
"tests/**" = ["F841"]      # 测试中偶有未用的中间变量/夹具占位，不影响断言
