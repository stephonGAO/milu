[project]
name = "milu"
version = "0.1.0"
description = "统一AI模型抽象层，兼容多家厂商API"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.66.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "jsonschema>=4.20.0",
    "ddgs>=8.0.0",
    "pyyaml>=6.0",
    "markdownify>=0.13.0",
    # doc_read 文档读取（docx/xlsx/xls/pdf/pptx）
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
    "python-pptx>=1.0.0",
    "xlrd>=2.0.0",
    # scheduler — 定时任务调度（cron 表达式解析）
    "croniter>=1.3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # 知识库测试需要（与 [kb] 对应）
    "numpy>=1.24",
]
mcp = [
    "mcp>=1.0.0",
]
# 内置 Web 服务（milu serve）：FastAPI + uvicorn + SSE 流式
serve = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "sse-starlette>=2.0.0",
]
# 向量知识库（Agent(knowledge=...)）：numpy 暴力余弦检索
kb = [
    "numpy>=1.24",
]

[project.scripts]
# 入口点（pip install 后可直接在终端调用）
milu = "milu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
